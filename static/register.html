<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Такси — регистрация</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">🚕 Такси</a>
    <div class="topbar-right">
      <a class="btn btn-ghost btn-sm" href="/login.html">Вход</a>
    </div>
  </header>

  <div class="auth-wrap">
    <section class="auth-card">
      <div>
        <h1>Регистрация</h1>
        <p class="muted">Создайте аккаунт пассажира или водителя.</p>
      </div>

      <form id="register-form" autocomplete="on">
        <label class="field">
          <span>Имя пользователя</span>
          <input name="username" required minlength="3" maxlength="32" autocomplete="username" placeholder="ivan" />
        </label>
        <label class="field">
          <span>Пароль (минимум 6 символов)</span>
          <input name="password" type="password" required minlength="6" maxlength="72" autocomplete="new-password" placeholder="••••••" />
        </label>
        <label class="field">
          <span>Кто вы</span>
          <select name="role" required>
            <option value="passenger">Пассажир</option>
            <option value="driver">Водитель</option>
          </select>
        </label>
        <button class="btn btn-primary" type="submit">Зарегистрироваться</button>
        <p id="form-error" class="error" hidden></p>
      </form>

      <p class="auth-footer">Уже есть аккаунт? <a href="/login.html">Войти</a></p>
    </section>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script src="/js/api.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
