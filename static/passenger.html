<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Такси — кабинет пассажира</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">🚕 Такси</a>
    <div class="topbar-right">
      <span id="stream-status" class="stream-status">… подключение</span>
      <span id="whoami" class="muted"></span>
      <button class="btn btn-ghost btn-sm" type="button" data-action="logout">Выйти</button>
    </div>
  </header>

  <main class="container">
    <section class="page-head">
      <div>
        <h1>Кабинет пассажира</h1>
        <p class="muted">Создайте заказ и выберите лучший отклик водителя.</p>
      </div>
    </section>

    <section class="panel">
      <h2>Новый заказ</h2>
      <form id="order-form" class="form-grid" autocomplete="off">
        <label class="field">
          <span>Откуда</span>
          <input name="from_point" required minlength="2" maxlength="255" placeholder="Аэропорт" />
        </label>
        <label class="field">
          <span>Куда</span>
          <input name="to_point" required minlength="2" maxlength="255" placeholder="Центр города" />
        </label>
        <label class="field">
          <span>Цена, ₽</span>
          <input name="price" type="number" min="1" step="1" required placeholder="500" />
        </label>
        <div class="form-actions">
          <button class="btn btn-primary" type="submit">Создать заказ</button>
        </div>
      </form>
    </section>

    <section>
      <div class="section-head">
        <h2>Мои заказы</h2>
        <button class="btn btn-ghost btn-sm" type="button" id="refresh">Обновить</button>
      </div>
      <div id="orders" class="stack">
        <p class="muted">Загрузка…</p>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>
  <script src="/js/api.js"></script>
  <script src="/js/passenger.js"></script>
</body>
</html>
